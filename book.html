<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Catalogue(XML Lab)</title>
    <style>
        .book-item{ border:1px solid #ccc; padding:12px; margin:8px 0; max-width:600px; }
    </style>
</head>
<body>
    <h1>Book Catalogue from XML File</h1>
    <div id="bookContainer"></div>

    <script>
        // Fetch and read the book.xml file in the same directory
        fetch('./book.xml')
        .then(res=>{
            if(!res.ok) throw new Error(`Http error ${res.status}`);
            return res.text(); // Return raw XML text instead of json()
        })
        .then(xmlText=>{
            // Create DOMParser instance to parse XML text
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText,'text/xml');

            // Get all book elements from xml document
            const allBooks = xmlDoc.querySelectorAll("book");
            const container = document.getElementById("bookContainer");

            allBooks.forEach(book=>{
                // Extract attribute and child element content
                const id = book.getAttribute("id");
                const title = book.querySelector("title").textContent;
                const author = book.querySelector("author").textContent;
                const price = book.querySelector("price").textContent;

                // Create div element for single book record
                const div = document.createElement("div");
                div.className = "book-item";
                div.innerHTML = `
                    <p><strong>Book ID:</strong>${id}</p>
                    <p><strong>Title:</strong>${title}</p>
                    <p><strong>Author:</strong>${author}</p>
                    <p><strong>Price:</strong>$${price}</p>
                `;
                container.appendChild(div);
            })
        })
        .catch(err=>{
            console.error("Fetch error:",err);
            document.getElementById("bookContainer").innerText = "Load failed: "+err.message;
        })
    </script>
</body>
</html>
